[package]
name = "code-interpreter-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22.1"
deno_core = "0.408.0"
deno_error = "0.7.1"
deno_web = "0.286.0"
deno_webidl = "0.255.0"
getrandom = "0.3.4"
reqwest = { version = "0.12.24", default-features = false, features = ["gzip", "rustls-tls"] }
rmcp = { version = "2.2.0", default-features = false, features = ["macros", "schemars", "server", "transport-streamable-http-server"] }
schemars = "1.1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
