[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pitchkit"
version = "1.0.0"
description = "Pitch-/Konzept-Grafiken (PNG + HTML) aus einer Inhalts-Spec"
requires-python = ">=3.10"
dependencies = ["pillow>=10"]
license = "MIT"

[tool.setuptools]
py-modules = ["pitchkit"]
